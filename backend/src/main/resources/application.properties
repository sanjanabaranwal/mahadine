# ===============================
# MAHADINE - Local Development Configuration
# ===============================
spring.application.name=mahadine-backend

# Server
server.port=${PORT:8080}

# --- Database ---
# Local dev default (used only when DB_* / MYSQL* env vars are not set)
# --- Database ---
spring.datasource.url=jdbc:mysql://${DB_HOST:${MYSQLHOST:localhost}}:${DB_PORT:${MYSQLPORT:3306}}/${DB_NAME:${MYSQL_DATABASE:${MYSQLDATABASE:mahadine}}}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:${MYSQL_USER:${MYSQLUSER:root}}}
spring.datasource.password=${DB_PASSWORD:${MYSQL_PASSWORD:${MYSQLPASSWORD:}}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- JWT ---
app.jwt.secret=${JWT_SECRET:mahadine-super-secret-demo-key-change-me-in-production-0123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- CORS (comma separated, used for local cross-origin dev only) ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://localhost:5173,http://localhost:8080}

# --- Admin/demo seed toggle ---
app.seed.enabled=${SEED_ENABLED:true}

# Misc
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
