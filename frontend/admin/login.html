<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — MAHADINE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/css/admin.css">
<link rel="stylesheet" href="/admin/css/admin-responsive.css">
</head>
<body>

<div class="admin-login-wrap">
  <div class="admin-login-card">
    <div class="brand"><span class="brand-mark">M</span> MAHADINE</div>
    <h1>Admin Portal</h1>
    <p class="subtitle">Sign in to manage restaurants, tables &amp; reservations</p>

    <form id="adminLoginForm" novalidate>
      <div class="form-group">
        <label for="email">Admin email</label>
        <input class="form-control" type="email" id="email" name="email" placeholder="Enter admin email" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input class="form-control" type="password" id="password" name="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">Sign In to Dashboard</button>
    </form>

    <p class="text-center mt-1"><a href="/index.html" style="color:var(--olive-600); font-size:0.85rem;">&larr; Back to main site</a></p>
  </div>
</div>

<script src="/admin/js/api.js"></script>
<script src="/admin/js/admin-login.js"></script>
</body>
</html>
