<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Profile — MAHADINE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/css/admin.css">
<link rel="stylesheet" href="/admin/css/admin-responsive.css">
</head>
<body>

<div class="admin-shell">
  <aside class="admin-sidebar" id="adminSidebar">
    <div class="brand"><span class="brand-mark">M</span> MAHADINE Admin</div>
    <nav class="admin-nav">
      <a href="/admin/dashboard.html"><span class="nav-icon">📊</span> Dashboard</a>
      <a href="/admin/restaurants.html"><span class="nav-icon">🍽️</span> Restaurants</a>
      <a href="/admin/tables.html"><span class="nav-icon">🪑</span> Tables</a>
      <a href="/admin/reservations.html"><span class="nav-icon">📅</span> Reservations</a>
      <a href="/admin/users.html"><span class="nav-icon">👥</span> Users</a>
      <a href="/admin/analytics.html"><span class="nav-icon">📈</span> Analytics</a>
      <a href="/admin/profile.html" class="active"><span class="nav-icon">⚙️</span> Profile</a>
    </nav>
    <div class="sidebar-footer"><button id="adminLogoutBtn">Logout</button></div>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <div class="flex gap-1">
        <button class="admin-menu-toggle" id="adminMenuToggle">☰</button>
        <h1>Admin Profile</h1>
      </div>
      <div class="admin-user"><span class="avatar" id="adminAvatar">A</span><span id="adminName">Admin</span></div>
    </div>

    <div class="admin-content">
      <div class="panel" style="max-width: 520px;">
        <div class="panel-header"><h3>Account Details</h3></div>
        <form id="adminProfileForm">
          <div class="form-group"><label>Full Name</label><input class="form-control" name="name" required></div>
          <div class="form-group"><label>Email</label><input class="form-control" name="email" disabled></div>
          <div class="form-group"><label>Phone</label><input class="form-control" name="phone" required></div>
          <hr style="border:none; border-top:1px solid var(--cream-300); margin: 20px 0;">
          <div class="form-group"><label>New Password (optional)</label><input class="form-control" type="password" name="newPassword" placeholder="Leave blank to keep current password"></div>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </form>
      </div>
    </div>
  </main>
</div>

<script src="/admin/js/api.js"></script>
<script src="/admin/js/layout.js"></script>
<script>
async function loadAdminProfile() {
  try {
    const profile = await adminApiRequest("/users/profile");
    AdminAuth.setUser(profile);
    const form = document.getElementById("adminProfileForm");
    form.name.value = profile.name;
    form.email.value = profile.email;
    form.phone.value = profile.phone || "";
    document.getElementById("adminAvatar").textContent = initials(profile.name);
    document.getElementById("adminName").textContent = profile.name;
  } catch (err) {
    showToast(err.message || "Could not load profile", "error");
  }
}

document.getElementById("adminProfileForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const form = e.target;
  const btn = form.querySelector('button[type="submit"]');
  btn.disabled = true;
  btn.textContent = "Saving...";
  try {
    const updated = await adminApiRequest("/users/profile", {
      method: "PUT",
      body: { name: form.name.value.trim(), phone: form.phone.value.trim(), newPassword: form.newPassword.value.trim() || null }
    });
    AdminAuth.setUser(updated);
    showToast("Profile updated", "success");
    form.newPassword.value = "";
  } catch (err) {
    showToast(err.message || "Could not update profile", "error");
  } finally {
    btn.disabled = false;
    btn.textContent = "Save Changes";
  }
});

document.addEventListener("DOMContentLoaded", loadAdminProfile);
</script>
</body>
</html>
