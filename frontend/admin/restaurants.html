<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restaurants — MAHADINE Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/css/admin.css">
<link rel="stylesheet" href="/admin/css/admin-responsive.css">
</head>
<body>

<div class="admin-shell">
  <aside class="admin-sidebar" id="adminSidebar">
    <div class="brand"><span class="brand-mark">M</span> MAHADINE Admin</div>
    <nav class="admin-nav">
      <a href="/admin/dashboard.html"><span class="nav-icon">📊</span> Dashboard</a>
      <a href="/admin/restaurants.html" class="active"><span class="nav-icon">🍽️</span> Restaurants</a>
      <a href="/admin/tables.html"><span class="nav-icon">🪑</span> Tables</a>
      <a href="/admin/reservations.html"><span class="nav-icon">📅</span> Reservations</a>
      <a href="/admin/users.html"><span class="nav-icon">👥</span> Users</a>
      <a href="/admin/analytics.html"><span class="nav-icon">📈</span> Analytics</a>
      <a href="/admin/reviews-questions.html"><span class="nav-icon">💬</span> Reviews &amp; Questions</a>
    </nav>
    <div class="sidebar-footer"><button id="adminLogoutBtn">Logout</button></div>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <div class="flex gap-1">
        <button class="admin-menu-toggle" id="adminMenuToggle">☰</button>
        <h1>Restaurants</h1>
      </div>
      <div class="admin-user"><span class="avatar" id="adminAvatar">A</span><span id="adminName">Admin</span></div>
    </div>

    <div class="admin-content">
      <div class="panel">
        <div class="panel-header">
          <h3>All Restaurants</h3>
          <button class="btn btn-primary" id="addRestaurantBtn">+ Add Restaurant</button>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th>Name</th><th>City</th><th>Location</th><th>Rating</th><th>Hours</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody id="restaurantsBody"><tr><td colspan="7"><div class="spinner"></div></td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Add/Edit Restaurant Modal -->
<div class="modal-overlay" id="restaurantModal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="restaurantModalTitle">Add Restaurant</h3>
      <button class="modal-close" id="restaurantModalClose">&times;</button>
    </div>
    <form id="restaurantForm">
      <div class="form-group"><label>Name</label><input class="form-control" name="name" required></div>
      <div class="form-group"><label>Description</label><textarea class="form-control" name="description" rows="3"></textarea></div>
      <div class="form-row">
        <div class="form-group"><label>Location (area)</label><input class="form-control" name="location" required></div>
        <div class="form-group"><label>City</label><input class="form-control" name="city" required></div>
      </div>
      <div class="form-group"><label>Address</label><input class="form-control" name="address"></div>
      <div class="form-row">
        <div class="form-group"><label>Phone</label><input class="form-control" name="phone"></div>
        <div class="form-group"><label>Email</label><input class="form-control" type="email" name="email"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Cuisine</label><input class="form-control" name="cuisine" placeholder="e.g. North Indian"></div>
        <div class="form-group"><label>Price Range</label>
          <select class="form-control" name="priceRange">
            <option value="$">$ (Budget)</option><option value="$$">$$ (Moderate)</option><option value="$$$">$$$ (Premium)</option><option value="$$$$">$$$$ (Luxury)</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Rating</label><input class="form-control" type="number" step="0.1" min="0" max="5" name="rating"></div>
        <div class="form-group"><label>Status</label>
          <select class="form-control" name="status"><option value="ACTIVE">Active</option><option value="INACTIVE">Inactive</option></select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Opening Time</label><input class="form-control" type="time" name="openingTime" required></div>
        <div class="form-group"><label>Closing Time</label><input class="form-control" type="time" name="closingTime" required></div>
      </div>
      <div class="form-group"><label>Image URL</label><input class="form-control" name="imageUrl" placeholder="https://..."></div>
      <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">Save Restaurant</button>
    </form>
  </div>
</div>

<script src="/admin/js/api.js"></script>
<script src="/admin/js/layout.js"></script>
<script src="/admin/js/restaurants.js"></script>
</body>
</html>
