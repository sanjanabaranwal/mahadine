<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Users — MAHADINE Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/css/admin.css">
<link rel="stylesheet" href="/admin/css/admin-responsive.css">
</head>
<body>

<div class="admin-shell">
  <aside class="admin-sidebar" id="adminSidebar">
    <div class="brand"><span class="brand-mark">M</span> MAHADINE Admin</div>
    <nav class="admin-nav">
      <a href="/admin/dashboard.html"><span class="nav-icon">📊</span> Dashboard</a>
      <a href="/admin/restaurants.html"><span class="nav-icon">🍽️</span> Restaurants</a>
      <a href="/admin/tables.html"><span class="nav-icon">🪑</span> Tables</a>
      <a href="/admin/reservations.html"><span class="nav-icon">📅</span> Reservations</a>
      <a href="/admin/users.html" class="active"><span class="nav-icon">👥</span> Users</a>
      <a href="/admin/analytics.html"><span class="nav-icon">📈</span> Analytics</a>
    </nav>
    <div class="sidebar-footer"><button id="adminLogoutBtn">Logout</button></div>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <div class="flex gap-1">
        <button class="admin-menu-toggle" id="adminMenuToggle">☰</button>
        <h1>Users</h1>
      </div>
      <div class="admin-user"><span class="avatar" id="adminAvatar">A</span><span id="adminName">Admin</span></div>
    </div>

    <div class="admin-content">
      <div class="panel">
        <div class="panel-header"><h3>Registered Users</h3></div>
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Role</th><th>Bookings</th><th></th></tr></thead>
            <tbody id="usersBody"><tr><td colspan="6"><div class="spinner"></div></td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="modal-overlay" id="userBookingsModal">
  <div class="modal" style="max-width: 640px;">
    <div class="modal-header">
      <h3 id="userBookingsModalTitle">Bookings</h3>
      <button class="modal-close" id="userBookingsModalClose">&times;</button>
    </div>
    <div id="userBookingsModalBody"></div>
  </div>
</div>

<script src="/admin/js/api.js"></script>
<script src="/admin/js/layout.js"></script>
<script src="/admin/js/users.js"></script>
</body>
</html>
