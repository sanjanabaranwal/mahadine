<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us — MAHADINE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a href="/index.html" class="brand"><span class="brand-mark">M</span> MAHADINE</a>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">☰</button>
    <ul class="nav-links" id="navLinks">
      <li><a href="/index.html">Home</a></li>
      <li><a href="/restaurants.html">Restaurants</a></li>
      <li><a href="/index.html#how-it-works">How It Works</a></li>
      <li><a href="/about.html">About</a></li>
      <li><a href="/contact.html" class="active">Contact</a></li>
    </ul>
    <div class="nav-actions" id="navAuthSlot"></div>
  </div>
</nav>

<div class="page-header">
  <div class="container">
    <h1>Get in Touch</h1>
    <p class="muted">Have a question or feedback? We'd love to hear from you.</p>
  </div>
</div>

<section class="section-tight">
  <div class="container" style="max-width: 640px;">
    <div id="contactAlert"></div>
    <form id="contactForm" novalidate>
      <div class="form-group">
        <label for="name">Your name</label>
        <input class="form-control" type="text" id="name" name="name" required>
        <div class="form-error"></div>
      </div>
      <div class="form-group">
        <label for="email">Email address</label>
        <input class="form-control" type="email" id="email" name="email" required>
        <div class="form-error"></div>
      </div>
      <div class="form-group">
        <label for="subject">Subject</label>
        <input class="form-control" type="text" id="subject" name="subject" placeholder="What is this about?">
      </div>
      <div class="form-group">
        <label for="message">Message</label>
        <textarea class="form-control" id="message" name="message" required></textarea>
        <div class="form-error"></div>
      </div>
      <button type="submit" class="btn btn-primary">Send Message</button>
    </form>
  </div>
</section>

<footer class="footer">
  <div class="container">
    <div class="footer-bottom">
      <span>&copy; 2026 MAHADINE. Demo project for educational purposes only.</span>
      <a href="/index.html">Back to Home</a>
    </div>
  </div>
</footer>

<script src="/js/api.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/main.js"></script>
<script>
document.getElementById("contactForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const form = e.target;
  clearFieldErrors(form);
  const btn = form.querySelector('button[type="submit"]');
  btn.disabled = true;
  btn.textContent = "Sending...";
  try {
    await Api.submitContact({
      name: form.name.value.trim(),
      email: form.email.value.trim(),
      subject: form.subject.value.trim(),
      message: form.message.value.trim()
    });
    document.getElementById("contactAlert").innerHTML = `<div class="alert alert-success">Thanks for reaching out! We'll get back to you soon.</div>`;
    form.reset();
    showToast("Message sent successfully!", "success");
  } catch (err) {
    if (err.errors) applyServerErrors(form, err.errors);
    showToast(err.message || "Could not send your message", "error");
  } finally {
    btn.disabled = false;
    btn.textContent = "Send Message";
  }
});
</script>
</body>
</html>
